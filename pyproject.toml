[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openoutfind"
# **The base, not the released version.** Major and minor are declared here and bumped by
# hand when a change deserves it; the patch is derived at publish time from the number of
# commits since `v0.1.0` (`.github/workflows/deploy.yml`, job `publish-pypi`), because
# every green push to `main` releases and PyPI version numbers are single-use. A local
# install reports this literal — `core/version.py` is what identifies a build precisely.
version = "0.1.0"
description = "Open-source AI lead finder: describe your product, get qualified leads with the reason each one fits."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENCE.md"]
authors = [{ name = "OpenOutFind", email = "hello@openoutreach.app" }]
keywords = [
    "lead-generation",
    "b2b",
    "outreach",
    "cold-email",
    "sales-automation",
    "self-hosted",
    "open-source",
    "crm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "Django>=5.2,<7.0",
    "pydantic>=2.9,<3",
    "pydantic-ai-slim[openai,anthropic,google,groq,mistral,cohere,bedrock]>=2,<3",
    # pydantic-ai 1.96 imports `from griffe import ...`, but griffe 2.x split into an
    # empty `griffelib` meta-package and reorganized symbols. Pin until upstream fixes.
    "griffe>=1,<2",
    "jsonpath-ng>=1.6,<2",
    "pandas>=2.2,<3",
    "jinja2>=3.1,<4",
    "termcolor>=2.4,<4",
    "tendo>=0.3,<0.4",
    "pyyaml>=6,<7",
    "fastembed>=0.4,<1",
    "scikit-learn>=1.4,<2",
    "huggingface_hub>=0.23,<1",
    "questionary>=2,<3",
    "pytz>=2024.1",
    "imapclient>=3,<4",
    "tenacity>=8,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-mock>=3.14",
    "pytest-cov>=5",
    "factory-boy>=3.3",
]

[project.scripts]
outfind = "openoutfind.__main__:main"

[project.urls]
Homepage = "https://openoutreach.app"
Source = "https://github.com/eracle/OpenOutFind"
Issues = "https://github.com/eracle/OpenOutFind/issues"

[tool.hatch.build.targets.wheel]
packages = ["openoutfind"]

# Onboarding reads §4/§6 of the notice verbatim at runtime. From site-packages there
# is no repo root, so the file ships inside the package instead.
[tool.hatch.build.targets.wheel.force-include]
"LEGAL_NOTICE.md" = "openoutfind/LEGAL_NOTICE.md"

[tool.hatch.build.targets.sdist]
# LEGAL_NOTICE.md is here because the wheel force-includes it: `python -m build`
# builds the wheel *from the sdist*, so a file missing here fails the release.
include = ["openoutfind", "README.md", "LICENCE.md", "LEGAL_NOTICE.md", "pyproject.toml"]
